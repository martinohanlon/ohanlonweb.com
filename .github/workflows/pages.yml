name: Build and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Refreshes _data/blog_posts.yml (and redeploys) weekly, even with no code push.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Refresh blog posts from stuffaboutcode.com
        run: bundle exec ruby bin/update-blog-posts.rb

      - name: Build site
        # Served at the domain root (ohanlonweb.com, custom domain configured
        # in repo Pages settings) so baseurl must be empty. Without --baseurl
        # pinned explicitly, the github-pages gem's metadata plugin
        # miscomputes it as "/pages/<owner>/<repo>", 404-ing all assets.
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
